<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Admin</title>
<style>
:root{--a:#3df0a0;--bg:#050a09;--c:#0b1512;--b:#1a3d31;--t:#e8fff6;--m:#7f9a91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,"Noto Sans Bengali",sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 60px}
.w{max-width:560px;margin:0 auto;display:grid;gap:14px}h1{font-size:18px;letter-spacing:.12em;margin:6px 0}
.c{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:16px;display:grid;gap:10px}
label{font-size:12px;color:var(--m);letter-spacing:.08em}
input,select,textarea{width:100%;background:#000;border:1px solid var(--b);border-radius:12px;color:var(--t);padding:12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a)}
button{font:inherit;border:1px solid var(--a);background:rgba(61,240,160,.12);color:var(--a);border-radius:12px;padding:12px 14px;cursor:pointer}
button.r{border-color:#7a2a2e;color:#ff6b70;background:none}button.g{border-color:var(--b);color:var(--m);background:none}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.tabs .on{background:var(--a);color:#04120c}
.k{border:1px solid var(--b);border-radius:14px;padding:12px;display:grid;gap:6px}.k b{font-family:ui-monospace,monospace;letter-spacing:.05em;word-break:break-all}.s{font-size:12px;color:var(--m)}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#12201b;border:1px solid var(--b);padding:10px 16px;border-radius:12px;display:none;z-index:9}[hidden]{display:none!important}
</style></head><body><div class="w">
<h1>HTTPS SERVER · ADMIN</h1>
<div class="c" id="login"><label>SERVER LINK (Worker URL)</label><input id="api" placeholder="https://xxxx.workers.dev" autocapitalize="off"><label>PASSWORD</label><input id="pw" type="password"><button onclick="login()">Login</button></div>
<div id="app" hidden class="w" style="padding:0">
 <div class="row tabs"><button class="on" data-p="pk">Keys</button><button class="g" data-p="ps">Telegram / Settings</button><button class="g" onclick="logout()">Logout</button></div>
 <div id="pk" class="w" style="padding:0">
  <div class="c"><label>NOTUN KEY BANAN</label>
   <div class="row"><div><label>DIN</label><input id="days" type="number" value="30" min="1"></div><div><label>KOYTA</label><input id="cnt" type="number" value="1" min="1" max="50"></div></div>
   <label>SERVER</label><select id="srv"><option value="ALL">Super (HTTPS SUPER SERVER)</option><option value="BASIC">HTTPS BASIC</option></select>
   <button onclick="gen()">Key + Code banan</button><div id="out" class="w" style="padding:0"></div></div>
  <div class="c"><label>SOB KEY</label><div id="list" class="w" style="padding:0"></div></div>
 </div>
 <div id="ps" hidden class="c"><label>TELEGRAM USERNAME (NEXT chaple ekhane jabe)</label><input id="tg" placeholder="myname" autocapitalize="off">
  <label>PRICE (30 DAYS)</label><input id="pr" type="number"><label>ORDER MESSAGE</label><textarea id="od" rows="2"></textarea><button onclick="saveS()">Save</button></div>
</div></div><div id="t"></div>
<script>
const $=i=>document.getElementById(i);let API=localStorage.getItem('adm_api')||'',PW=sessionStorage.getItem('adm_pw')||'',DATA={};
$('api').value=API;
function toast(m){const t=$('t');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2200)}
async function call(p,b){const r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json','X-Admin':PW},body:JSON.stringify(b||{})});return r.json()}
const fmt=c=>String(c).replace(/(\d{4})(\d{4})(\d{4})/,'$1-$2-$3');
const st=v=>{if(!v.act)return'unused';const d=Math.ceil((v.act+v.days*864e5-Date.now())/864e5);return d<=0?'expired':d+' din baki'};
const card=v=>(DATA[v.key]=v,'<div class="k"><b>'+v.key+'</b><div>Code: <b>'+fmt(v.code)+'</b></div><div class="s">'+(v.server==='ALL'?'SUPER':'BASIC')+' · '+v.days+' din · '+st(v)+' · '+(v.urls||[]).length+' site</div><div class="row"><button data-c="'+v.key+'">Copy</button><button class="r" data-d="'+v.key+'">Delete</button></div></div>');
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copy hoyeche')}catch(e){prompt('Copy korun:',t)}}
async function login(){API=$('api').value.trim().replace(/\/$/,'');PW=$('pw').value;
  try{const r=await call('/api/admin/list');if(!r.ok)throw 0;localStorage.setItem('adm_api',API);sessionStorage.setItem('adm_pw',PW);start(r)}catch(e){toast('Login hoy nai: link ba password bhul')}}
function start(r){$('login').hidden=true;$('app').hidden=false;draw(r.keys);fetch(API+'/api/settings').then(x=>x.json()).then(s=>{$('tg').value=s.telegram;$('pr').value=s.price;$('od').value=s.order})}
function draw(k){$('list').innerHTML=k.length?k.map(card).join(''):'<div class="s">Kono key nai.</div>'}
async function reload(){const r=await call('/api/admin/list');if(r.ok)draw(r.keys)}
async function gen(){const r=await call('/api/admin/add',{days:$('days').value,count:$('cnt').value,server:$('srv').value});
  if(!r.ok)return toast('Hoy nai');$('out').innerHTML=r.keys.map(card).join('');reload()}
async function saveS(){const r=await call('/api/admin/settings',{telegram:$('tg').value,price:$('pr').value,order:$('od').value});
  toast(r.ok?'Save hoyeche':r.error==='bad_telegram'?'Username thik na (5-32 ta, a-z 0-9 _)':'Hoy nai')}
function logout(){sessionStorage.removeItem('adm_pw');location.reload()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p){document.querySelectorAll('.tabs button[data-p]').forEach(x=>x.className=x===b?'on':'g');$('pk').hidden=b.dataset.p!=='pk';$('ps').hidden=b.dataset.p!=='ps'}
  if(b.dataset.c){const v=DATA[b.dataset.c];copy('Key: '+v.key+'\nCode: '+fmt(v.code))}
  if(b.dataset.d&&confirm('Key ta muche felbo?')){await call('/api/admin/del',{key:b.dataset.d});reload();toast('Deleted')}});
if(API&&PW)login();
</script></body></html>
